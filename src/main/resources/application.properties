spring.application.name=PathStudy

# ---- Local dev database: H2 file-based (no install needed, data persists) ----
spring.datasource.url=jdbc:h2:file:./data/pathstudy
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: disable cache in dev so template edits reload
spring.thymeleaf.cache=false

server.port=8080

# UTF-8 everywhere (important for Vietnamese content)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.name=PathStudy
