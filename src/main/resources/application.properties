spring.application.name=PathStudy

# ---- Local dev database: H2 file-based (no install needed, data persists) ----
spring.datasource.url=jdbc:h2:file:./data/pathstudy
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: disable cache in dev so template edits reload
spring.thymeleaf.cache=false

server.port=8080

# UTF-8 everywhere (important for Vietnamese content)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.name=PathStudy

# Remember-me signing key. Stable across restarts so login cookies survive
# server restarts / free-tier spin-down. Override in prod via REMEMBER_ME_KEY.
app.rememberme.key=${REMEMBER_ME_KEY:pathstudy-remember-me-key-2026}

# ---- Payment (bank transfer + SePay/Casso webhook) ----
# TODO: thay bằng thông tin tài khoản ngân hàng CỦA BẠN (dùng mã ngân hàng VietQR,
# ví dụ MB, VCB, ACB, TCB, VPB, BIDV...). accountName viết HOA không dấu.
app.payment.bank=${PAYMENT_BANK:MB}
app.payment.account=${PAYMENT_ACCOUNT:0000000000}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:PATHSTUDY}
# Token bí mật để xác thực webhook từ SePay/Casso. Đổi ở prod qua PAYMENT_WEBHOOK_TOKEN.
app.payment.webhook-token=${PAYMENT_WEBHOOK_TOKEN:changeme-webhook-token}

# ---- AI (Gemini) để chấm/tư vấn lộ trình. Để trống = dùng lộ trình rule-based.
# Lấy key tại https://aistudio.google.com/apikey rồi đặt env GEMINI_API_KEY.
app.ai.gemini-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-flash-latest}
