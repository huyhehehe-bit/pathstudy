<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Học theo giáo trình')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('path')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Học theo giáo trình')}"></header>
        <div class="content stack" style="max-width:820px">
            <a th:href="@{/english}" class="chip" style="align-self:flex-start">
                <span th:insert="~{fragments/icons :: ic('arrow')}"></span> Quay lại</a>

            <div class="section-head">
                <h2 style="font-size:24px">Giáo trình Tiếng Anh</h2>
                <p class="muted">Học lý thuyết theo tài liệu. Làm đề để đo điểm yếu và nhận lộ trình.</p>
            </div>

            <div class="faint" th:if="${#lists.isEmpty(docs)}" style="font-size:14px">Chưa có giáo trình.</div>
            <div class="card card-pad stack-sm" th:each="d : ${docs}">
                <h3 style="font-size:16px" th:text="${d.title}">Các thành phần cơ bản trong câu</h3>
                <div class="sec-body" style="white-space:pre-line;font-size:14px;line-height:1.75" th:text="${d.content}">Nội dung…</div>
            </div>

            <a th:href="@{/english}" class="btn btn-primary" style="align-self:flex-start">
                Làm đề để kiểm tra <span th:insert="~{fragments/icons :: ic('arrow')}"></span></a>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: toast}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
