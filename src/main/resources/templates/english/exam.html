<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Làm đề')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('path')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Làm đề')}"></header>
        <div class="content">
            <form th:action="@{'/english/exam/' + ${exam.id} + '/submit'}" method="post"
                  class="stack" style="max-width:720px;margin:0 auto">
                <div>
                    <span class="eyebrow">Đề luyện tập</span>
                    <h2 style="font-size:22px;margin-top:4px" th:text="${exam.title}">Đề số 1</h2>
                    <p class="muted" style="font-size:14px" th:text="${exam.description}">Ngữ pháp cơ bản</p>
                </div>

                <div class="q-card" th:each="q, qi : ${questions}">
                    <div th:if="${q.passage != null and !q.passage.isBlank() and (qi.first or questions[qi.index - 1].passage != q.passage)}"
                         style="white-space:pre-line;line-height:1.65;font-size:14px;background:var(--primary-tint);padding:14px;border-radius:10px;margin-bottom:12px"
                         th:text="${q.passage}">Đoạn văn</div>
                    <div class="q-num" th:text="'Câu ' + ${qi.count} + ' / ' + ${#lists.size(questions)}">Câu 1</div>
                    <div class="q-text" th:text="${q.text}">Câu hỏi?</div>
                    <div class="options">
                        <label class="option" th:each="opt, oi : ${q.options}">
                            <input type="radio" th:name="'q_' + ${q.id}" th:value="${oi.index}" th:required="${oi.first}"/>
                            <span class="key" th:text="${#strings.substring('ABCD', oi.index, oi.index + 1)}">A</span>
                            <span th:text="${opt}">Đáp án</span>
                        </label>
                    </div>
                </div>

                <div class="between">
                    <a th:href="@{/english}" class="btn btn-ghost">Quay lại</a>
                    <button type="submit" class="btn btn-primary btn-lg">Nộp bài &amp; xem đánh giá</button>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
