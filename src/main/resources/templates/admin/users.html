<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản trị người dùng')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('admin')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Quản trị người dùng')}"></header>
        <div class="content stack">
            <div class="section-head">
                <h2 style="font-size:24px">Người dùng</h2>
                <p class="muted">Phân vai trò và quản lý Premium: Học sinh · Giáo viên · Admin.</p>
            </div>

            <div class="stack" style="gap:10px">
                <div class="card card-pad between" th:each="u : ${users}" style="gap:14px;flex-wrap:wrap">
                    <div class="center" style="gap:12px">
                        <span class="dot" style="width:38px;height:38px;background:var(--primary);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700"
                              th:text="${#strings.substring(u.fullName,0,1)}">A</span>
                        <div>
                            <strong th:text="${u.fullName}">Nguyễn An</strong>
                            <div class="faint" style="font-size:12px" th:text="${u.email}">email</div>
                        </div>
                    </div>
                    <div class="center" style="gap:10px;flex-wrap:wrap">
                        <span class="pill"
                              th:classappend="${premiumUntil[u.id] != null} ? 'pill-doing' : 'pill-todo'"
                              th:text="${premiumUntil[u.id] != null} ? 'Premium · HSD ' + ${premiumUntil[u.id]} : 'Free'">Free</span>
                        <span class="pill"
                              th:classappend="${u.role == 'ADMIN'} ? 'pill-warn' : (${u.role == 'TEACHER'} ? 'pill-doing' : 'pill-todo')"
                              th:text="${u.role}">STUDENT</span>
                        <form th:action="@{'/admin/users/' + ${u.id} + '/role'}" method="post" class="center" style="gap:8px">
                            <select name="role" class="textarea" style="padding:8px 10px;width:auto">
                                <option th:each="r : ${roles}" th:value="${r}" th:selected="${r == u.role}" th:text="${r}">STUDENT</option>
                            </select>
                            <button type="submit" class="btn btn-soft">Lưu</button>
                        </form>
                        <form th:action="@{'/admin/users/' + ${u.id} + '/premium/grant'}" method="post" class="center" style="gap:6px">
                            <input type="number" name="days" value="30" min="1" max="3650"
                                   class="textarea" style="padding:8px 10px;width:78px" title="Số ngày Premium"/>
                            <button type="submit" class="btn btn-soft">Mở Premium</button>
                        </form>
                        <form th:if="${premiumUntil[u.id] != null}"
                              th:action="@{'/admin/users/' + ${u.id} + '/premium/revoke'}" method="post"
                              onsubmit="return confirm('Thu hồi Premium của người dùng này?');">
                            <button type="submit" class="btn btn-ghost">Thu hồi</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: toast}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
