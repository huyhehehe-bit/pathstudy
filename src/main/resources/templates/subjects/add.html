<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thêm môn học')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('add')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Thêm môn học')}"></header>
        <div class="content stack">
            <div class="section-head">
                <h2 style="font-size:24px">Thêm môn học</h2>
                <p class="muted">Bạn muốn thử thêm môn khác? Hệ thống sẽ tích hợp vào lịch học hiện tại.</p>
            </div>

            <div th:if="${#lists.isEmpty(subjects)}" class="card card-pad" style="text-align:center;color:var(--ink-2)">
                Bạn đã thêm tất cả môn hiện có.
            </div>

            <form th:action="@{/subjects/add}" method="post" class="stack" style="max-width:760px">
                <div class="pick-grid">
                    <th:block th:each="s : ${subjects}">
                        <label th:if="${s.active}" class="pick">
                            <input type="radio" name="code" th:value="${s.code}"/>
                            <span class="check-dot" th:insert="~{fragments/icons :: ic('check')}"></span>
                            <span class="pick-inner">
                                <span class="tile" th:classappend="'tile-' + ${s.colorKey}" th:insert="~{fragments/icons :: ic(${s.iconKey})}"></span>
                                <span><span style="font-weight:700;display:block" th:text="${s.name}">Tiếng Anh</span>
                                    <span class="faint" style="font-size:12px" th:text="${s.grade}">THPT</span></span>
                            </span>
                        </label>
                        <label th:unless="${s.active}" class="pick disabled">
                            <span class="pick-inner">
                                <span class="tile" th:classappend="'tile-' + ${s.colorKey}" th:insert="~{fragments/icons :: ic(${s.iconKey})}"></span>
                                <span><span style="font-weight:700;display:block" th:text="${s.name}">Toán</span>
                                    <span style="font-size:12px;color:var(--warn)">Sắp ra mắt</span></span>
                            </span>
                        </label>
                    </th:block>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="align-self:flex-start;min-width:240px"
                        th:if="${!#lists.isEmpty(subjects)}">Thêm & làm kiểm tra đầu vào</button>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: toast}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
