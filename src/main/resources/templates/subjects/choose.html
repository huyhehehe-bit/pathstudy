<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chọn môn học')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('path')}"></aside>
    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Chọn môn học')}"></header>
        <div class="content stack">
            <div class="section-head" style="text-align:center;align-items:center;max-width:560px;margin:8px auto 0">
                <h2 style="font-size:26px">Bạn muốn cải thiện môn nào?</h2>
                <p class="muted">Chọn 1 môn để bắt đầu tập trung. Bạn có thể thêm môn khác sau.</p>
            </div>

            <form th:action="@{/subjects/choose}" method="post" class="stack" style="max-width:760px;margin:0 auto;width:100%">
                <div class="pick-grid">
                    <th:block th:each="s, it : ${subjects}">
                        <label th:if="${s.active}" class="pick">
                            <input type="radio" name="code" th:value="${s.code}" th:checked="${it.first}"/>
                            <span class="check-dot" th:insert="~{fragments/icons :: ic('check')}"></span>
                            <span class="pick-inner">
                                <span class="tile" th:classappend="'tile-' + ${s.colorKey}" th:insert="~{fragments/icons :: ic(${s.iconKey})}"></span>
                                <span><span style="font-weight:700;display:block" th:text="${s.name}">Ngữ văn</span>
                                    <span class="faint" style="font-size:12px" th:text="${s.grade}">THPT</span></span>
                            </span>
                        </label>
                        <label th:unless="${s.active}" class="pick disabled">
                            <span class="pick-inner">
                                <span class="tile" th:classappend="'tile-' + ${s.colorKey}" th:insert="~{fragments/icons :: ic(${s.iconKey})}"></span>
                                <span><span style="font-weight:700;display:block" th:text="${s.name}">Toán</span>
                                    <span style="font-size:12px;color:var(--warn)">Sắp ra mắt</span></span>
                            </span>
                        </label>
                    </th:block>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="align-self:center;min-width:280px">
                    Bắt đầu <span th:insert="~{fragments/icons :: ic('arrow')}"></span>
                </button>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: toast}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
