# Production profile: PostgreSQL.
# On Render, the PG* vars below are injected from the managed database by render.yaml.
# For other hosts, set PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD (or override
# spring.datasource.* directly).

# DB: mặc định dùng PG* (Render managed Postgres — render.yaml tự nối).
# Chuyển sang Neon (hoặc Postgres khác) mà KHÔNG sửa code: đặt 3 env
#   DATABASE_URL        = jdbc:postgresql://<host>/<db>?sslmode=require   (Neon bắt buộc SSL)
#   DATABASE_USERNAME   = <user>
#   DATABASE_PASSWORD   = <password>
# Neon không hết hạn như Render free Postgres (~30 ngày).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}}
spring.datasource.username=${DATABASE_USERNAME:${PGUSER:}}
spring.datasource.password=${DATABASE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

server.port=${PORT:8080}
