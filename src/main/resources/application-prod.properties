# Production profile: PostgreSQL.
# On Render, the PG* vars below are injected from the managed database by render.yaml.
# For other hosts, set PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD (or override
# spring.datasource.* directly).

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.thymeleaf.cache=true

server.port=${PORT:8080}
