# Render Blueprint: tao san 1 web service (Docker) + 1 PostgreSQL,
# tu dong noi bien moi truong. Deploy: Render Dashboard -> New -> Blueprint
# -> chon repo nay -> Apply.
databases:
  - name: pathstudy-db
    databaseName: pathstudy
    user: pathstudy
    plan: free

services:
  - type: web
    name: pathstudy
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PGHOST
        fromDatabase:
          name: pathstudy-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: pathstudy-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: pathstudy-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: pathstudy-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: pathstudy-db
          property: password
